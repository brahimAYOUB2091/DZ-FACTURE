<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>DZ فاتورة</title>
<style>
:root{--bg:#eef2f8;--card:#fff;--card2:#f7f9fd;--line:#dbe4f0;--text:#13213a;--muted:#5b6b85;--blue:#0b72b5;--orange:#e07b0c;--hero:#0b4f8a;--err:#c0392b;
--t1:#2ea66a;--t2:#d9a514;--t3:#ee7d2b;--t4:#d64545;--c1:#1ea7e8;--c2:#f28c28;--c3:#f5b800;--c4:#ee4b4b;--c5:#8a96a3;--sh:0 4px 14px rgba(20,40,80,.08)}
:root[data-theme="dark"]{--bg:#0b1426;--card:#14233d;--card2:#1a2c4b;--line:#25395c;--text:#eaf1fb;--muted:#8ea3c2;--blue:#29b6f6;--orange:#f5922f;--hero:#0f3a6b;--err:#ff7b6b;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px 96px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
h1{display:flex;align-items:center;gap:10px;font-size:1.3rem;margin:0}.logo{width:38px;height:38px;border-radius:10px;flex:none}
.tools{display:flex;gap:6px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button,.theme{background:var(--card);color:var(--text);border:0;padding:8px 10px;font-size:.85rem;cursor:pointer;min-width:40px}
.seg button.on{background:var(--blue);color:#06101f;font-weight:700}
.theme{border:1px solid var(--line);border-radius:12px}.theme svg{width:20px;height:20px;display:block;margin:auto}
.sub{color:var(--muted);margin:0 0 14px;font-size:.88rem}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .wide{grid-column:1/-1}
.tile,.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--sh)}
.card{margin-bottom:14px}.card h2{margin:0 0 12px;font-size:1.02rem}
.tile h3{margin:0 0 10px;font-size:.85rem;color:var(--muted);font-weight:600}
.kpi .k{font-size:.82rem;color:var(--muted)}.kpi b{display:block;font-size:1.55rem;margin:6px 0 2px;direction:ltr;text-align:start}.kpi small{display:block;color:var(--muted)}.kpi small.mo{color:var(--text);opacity:.8;margin-top:2px}
.kpi.e{border-top:3px solid var(--c2)}.kpi.w{border-top:3px solid var(--c1)}
.cmp{padding:10px 0;border-bottom:1px dashed var(--line)}.cmp:last-child{border:0}
.cmp .cl{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.cmp .cl small{color:var(--muted);direction:ltr}
.cmp .cv{display:flex;justify-content:space-between;align-items:center;margin:6px 0}.cmp .cv b{font-size:1.2rem;direction:ltr}
.dl{font-style:normal;font-weight:700;padding:3px 12px;border-radius:20px;background:var(--bg);direction:ltr}
.dl.up{color:var(--c4)}.dl.down{color:var(--t1)}.dl.flat{color:var(--muted)}
.cs{color:var(--muted);font-size:.8rem;margin:2px 0 0}
.empty{color:var(--muted);font-size:.85rem;margin:6px 0}
.elec{border-top:3px solid var(--c2)}.gas{border-top:3px solid var(--c3)}.water{border-top:3px solid var(--c1)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.84rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:12px;font-size:1.05rem;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
input{direction:ltr;text-align:start}select{margin-top:10px;font-size:1rem}
:focus-visible{outline:3px solid var(--c2);outline-offset:1px}
.go{width:100%;padding:14px;font-size:1.08rem;font-weight:700;border:0;border-radius:14px;background:linear-gradient(135deg,var(--c2),#f7b04a);color:#1d1203;cursor:pointer;box-shadow:0 4px 14px rgba(242,140,40,.35)}
.go:active{transform:scale(.99)}
.ghost{margin-top:12px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:.9rem}
.err{color:var(--err);margin:8px 0 0;min-height:1.4em;font-size:.9rem}
.note{color:var(--muted);font-size:.8rem;margin:10px 0 0}.warn{border:1px solid var(--c2);border-radius:12px;padding:10px;color:var(--text)}
.live{font-size:.82rem;color:var(--muted);min-height:1.3em;margin:6px 0 0;direction:ltr;text-align:start}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td{padding:7px 0;border-bottom:1px dashed var(--line)}td:last-child{text-align:end;white-space:nowrap}
tr.sum td{font-weight:700;border-bottom:1px solid var(--line)}
.total{background:linear-gradient(135deg,var(--hero),#1272b6);color:#fff;border-radius:22px;padding:20px 16px;text-align:center;box-shadow:var(--sh)}
.total b{display:block;font-size:1.9rem;margin-top:4px;direction:ltr}
.tc{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}.tc h3{font-size:.85rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:.78rem;color:var(--muted)}
.legend b,.lg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px}
.trow{display:grid;grid-template-columns:3.4rem 1fr auto;gap:8px;align-items:center;margin:8px 0;font-size:.82rem}
.trow .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:0}
.trow .bar i{display:block;height:100%;border-radius:5px;width:0;transition:width .7s ease}
.trow span:last-child{direction:ltr;white-space:nowrap;color:var(--muted)}
.dn{display:flex;align-items:center;gap:14px}.dnsvg{width:44%;max-width:150px;flex:none}
.lg{list-style:none;margin:0;padding:0;font-size:.8rem;color:var(--muted);display:grid;gap:6px}
.chart,.ringsvg,.dnsvg{direction:ltr}
.chart{width:100%;height:auto;max-height:230px;display:block}.axt{fill:var(--muted);font-size:9px}.gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.trk{fill:none;stroke:var(--line);stroke-width:14}.rt{fill:var(--text);font-size:22px;font-weight:700}.ringsvg{width:100%;max-width:130px;display:block;margin:0 auto}
.rsub{text-align:center;color:var(--muted);font-size:.78rem;margin:6px 0 0;direction:ltr}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.hrow .ico{width:36px;height:36px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}.hrow .ico svg{width:20px;height:20px}
.hrow div{flex:1;min-width:0}.hrow b{display:block;direction:ltr;text-align:start}.hrow small{color:var(--muted)}
.hrow button{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);text-decoration:none;font-size:.7rem;padding:6px 2px;border-radius:14px}
.nav a svg{width:22px;height:22px}.nav a.on{color:var(--blue);background:rgba(41,182,246,.13);font-weight:700}
@media (min-width:900px){
 .grid{grid-template-columns:repeat(4,1fr)}.kpi{grid-column:span 2}.grid .wide{grid-column:span 2}.grid .full{grid-column:1/-1}
 .nav{left:auto;right:auto;top:0;bottom:0;inset-inline-start:0;width:190px;flex-direction:column;justify-content:flex-start;gap:6px;padding:80px 12px 12px;border-top:0;border-inline-end:1px solid var(--line)}
 .nav a{flex:none;flex-direction:row;font-size:.95rem;gap:10px;padding:12px}
 .wrap{margin-inline-start:210px;padding-bottom:30px}}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#dash>*,#out>*,#wout>*{animation:up .35s ease both}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1><img class="logo" src="logo.png" alt="">DZ فاتورة</h1>
    <div class="tools">
      <div class="seg" id="langs"><button data-l="ar">ع</button><button data-l="en">EN</button><button data-l="fr">FR</button></div>
      <button class="theme" id="theme" type="button"></button>
    </div>
  </div>
  <p class="sub" id="subline" data-i="dSub"></p>

  <section id="dash" class="grid">
    <div class="tile kpi e"><span class="k" data-i="kE"></span><b id="kE">—</b><small id="kEd"></small><small class="mo" id="kEm"></small></div>
    <div class="tile kpi w"><span class="k" data-i="kW"></span><b id="kW">—</b><small id="kWd"></small><small class="mo" id="kWm"></small></div>
    <div class="tile full wide"><h3 data-i="dTrend"></h3><div id="cTrend"></div></div>
    <div class="tile full wide"><h3 data-i="dCmp"></h3><div id="cCmp"></div></div>
    <div class="tile wide"><h3 data-i="dBreak"></h3><div id="cDonut"></div></div>
    <div class="tile"><h3 data-i="dRingE"></h3><div id="cRingE"></div></div>
    <div class="tile"><h3 data-i="dRingW"></h3><div id="cRingW"></div></div>
    <div class="tile wide"><h3 data-i="dPie"></h3><div id="cPie"></div></div>
    <div class="tile wide"><h3 data-i="dBars"></h3><div id="cBars"></div></div>
  </section>

  <section id="p-eg" class="hidden">
  <div class="card elec"><h2 data-i="elec"></h2><div class="row">
    <div><label for="eo" data-i="old"></label><input id="eo" type="number" inputmode="decimal" min="0" step="any"></div>
    <div><label for="en" data-i="new"></label><input id="en" type="number" inputmode="decimal" min="0" step="any"></div>
  </div><p class="live" id="live-e"></p>
    <label for="pmd" style="margin-top:10px" data-i="pmd"></label>
    <select id="pmd"><option value="4">4 kW</option><option value="6" selected>6 kW</option><option value="12">12 kW</option><option value="20">20 kW (3φ)</option><option value="40">40 kW (3φ)</option></select>
  </div>
  <div class="card gas"><h2 data-i="gas"></h2><div class="row">
    <div><label for="go" data-i="old"></label><input id="go" type="number" inputmode="decimal" min="0" step="any"></div>
    <div><label for="gn" data-i="new"></label><input id="gn" type="number" inputmode="decimal" min="0" step="any"></div>
  </div><p class="live" id="live-g"></p></div>

  <p class="note" data-i="optHint"></p>
  <button class="go" id="calc" type="button" data-i="calc"></button>
  <p class="err" id="err" role="alert"></p>

  <div id="out" class="hidden">
    <div class="card elec" id="ecard"><h2 data-i="elecD"></h2><table id="etab"></table><div id="echart"></div></div>
    <div class="card gas" id="gcard"><h2 data-i="gasD"></h2><table id="gtab"></table><div id="gchart"></div></div>
    <div class="card"><h2 data-i="fees"></h2><table id="ftab"></table></div>
    <div class="card"><h2 data-i="bkTitle"></h2><div id="bk"></div></div>
    <div class="total"><span data-i="total"></span><b id="tot"></b></div>
    <p class="note" data-i="note"></p>
  </div>
  </section>

  <section id="p-w" class="hidden">
    <div class="card water"><h2 data-i="water"></h2>
      <label for="prov" data-i="prov"></label>
      <select id="prov" style="margin:0 0 10px"><option value="ade" data-i="pADE"></option><option value="seaal" data-i="pSEAAL"></option></select>
      <div class="row">
        <div><label for="wo" data-i="old"></label><input id="wo" type="number" inputmode="decimal" min="0" step="any"></div>
        <div><label for="wn" data-i="new"></label><input id="wn" type="number" inputmode="decimal" min="0" step="any"></div>
      </div><p class="live" id="live-w"></p>
    </div>
    <button class="go" id="wcalc" type="button" data-i="calc"></button>
    <p class="note warn hidden" id="wsealnote" data-i="seaalNote"></p>
    <p class="err" id="werr" role="alert"></p>
    <div id="wout" class="hidden">
      <div class="card water"><h2 data-i="waterD"></h2><table id="wtab"></table><div id="wchart"></div></div>
      <div class="card water"><h2 data-i="sanD"></h2><table id="stab"></table><div id="schart"></div></div>
      <div class="card"><h2 data-i="fees"></h2><table id="wftab"></table></div>
      <div class="card"><h2 data-i="bkTitle"></h2><div id="wbk"></div></div>
      <div class="total"><span data-i="total"></span><b id="wtot"></b></div>
      <p class="note warn" id="wwarn"></p>
      <p class="note" data-i="note"></p>
    </div>
  </section>

  <section id="p-h" class="hidden">
    <div class="card"><h2 data-i="nH"></h2><div id="hlist"></div><p class="note" id="hnote"></p><button class="ghost" id="hclear" type="button" data-i="hClear"></button></div>
  </section>
</div>
<nav class="nav" id="nav">

  <a href="#h" data-v="h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i="nH"></span></a>
</nav>

    body+='<rect x="'+X+'" y="'+Yb+'" width="'+bw+'" height="'+h+'" rx="'+bw/2+'" fill="url(#pg'+i+')"/><circle cx="'+(X+bw/2)+'" cy="'+(Yb-9)+'" r="7" fill="'+x.c+'"/><text class="axt" x="'+(X+bw/2)+'" y="'+(Yb-20)+'" text-anchor="middle">'+Math.round(x.v)+'</text><text class="axt" x="'+(X+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+x.l+'</text>';});
  return'<svg class="chart" viewBox="0 0 '+W+' '+H+'" dir="ltr" role="img"><defs>'+defs+'</defs>'+body+'</svg>';}
function metric(r,c){if(r.tp==="w")return{v:c.m3,u:t("m3")};return c.hasE?{v:c.kwh,u:"kWh"}:{v:c.th,u:"Th"};}
function cmpRow(list,label){
  var sig=function(r){return r.tp==="w"?"w":(r.inp[0]!=null)+"/"+(r.inp[2]!=null)};
  if(list.length)list=list.filter(function(r){return sig(r)===sig(list[list.length-1])});
  if(list.length<2)return"";
  var p=list[list.length-2],c=list[list.length-1],a=calcRec(p),b=calcRec(c),m0=metric(p,a),m1=metric(c,b),pc=a.total?(b.total-a.total)/a.total*100:0,da=" "+t("da");
  var cls=Math.abs(pc)<0.5?"flat":pc>0?"up":"down",arrow=cls==="flat"?"= ":pc>0?"▲ +":"▼ -";
  var B=function(x){return'<bdi dir="ltr">'+x+'</bdi>'};
  var l1='<p class="cs">'+B(f(a.total)+" → "+f(b.total)+da)+'</p>';
  var l2=m0.u===m1.u?'<p class="cs">'+t("use")+": "+B(q(m0.v)+" → "+q(m1.v)+" "+m1.u)+'</p>':"";
  var l3=m1.v>0&&(c.tp==="w"||b.hasE!==b.hasG)?'<p class="cs">'+t("avgP")+": "+B((b.total/m1.v).toFixed(2))+da+" / "+B(m1.u)+'</p>':"";
  return'<div class="cmp"><div class="cl"><b>'+label+'</b><small>'+B(fs(p.ts)+" → "+fs(c.ts))+'</small></div><div class="cv"><b>'+f(b.total)+da+'</b><i class="dl '+cls+'">'+arrow+Math.abs(Math.round(pc))+'%</i></div>'+l1+l2+l3+'</div>';
}
function renderDash(){
  var a=recs().sort(function(x,y){return x.ts-y.ts}),E=a.filter(function(r){return r.tp==="eg"}),Ws=a.filter(function(r){return r.tp==="w"});
  var dE=E.length?E[E.length-1]:null,dW=Ws.length?Ws[Ws.length-1]:null,cE=dE&&calcRec(dE),cW=dW&&calcRec(dW),da=" "+t("da");
  $("kE").textContent=cE?f(cE.total)+da:"—";$("kEd").textContent=dE?fd(dE.ts):"";
  $("kEm").textContent=cE?"≈ "+f(cE.total/3)+da+" / "+t("mo"):"";$("kWm").textContent=cW?"≈ "+f(cW.total/3)+da+" / "+t("mo"):"";
  $("kW").textContent=cW?f(cW.total)+da:"—";$("kWd").textContent=dW?fd(dW.ts):"";
  $("cTrend").innerHTML=lineChart([{n:t("nEG"),c:"var(--c2)",pts:E.map(function(r){return{ts:r.ts,v:calcRec(r).total}})},{n:t("nW"),c:"var(--c1)",pts:Ws.map(function(r){return{ts:r.ts,v:calcRec(r).total}})}]);
  $("cCmp").innerHTML=cmpRow(E,t("nEG"))+cmpRow(Ws,t("nW"))||'<p class="empty">'+t("dCmpEmpty")+"</p>";
  var parts=cE?[[t("bkUse"),cE.ea+cE.ga,"var(--c1)"],[t("bkSub"),cE.sub,"var(--c2)"],[t("bkTva"),cE.vt,"var(--c3)"],[t("bkFixed"),cE.fix+cE.hab,"var(--c4)"],[t("bkStamp"),cE.st,"var(--c5)"]]:
    cW?[[t("bkWater"),cW.ht,"var(--c1)"],[t("bkTva"),cW.vat,"var(--c3)"],[t("bkFees"),cW.mgmt+cW.qual+cW.eco,"var(--c4)"],[t("bkStamp"),cW.st,"var(--c5)"]]:null;
  $("cDonut").innerHTML=parts?donut(parts):empty();
  var tE=TF.electricity.tiers[0].upTo+TF.electricity.tiers[1].upTo,tW=TF.water.tiers[0].upTo+TF.water.tiers[1].upTo;
  var rc=function(p){return p>=100?"var(--c4)":p>=80?"var(--c2)":"var(--c1)"};
  $("cRingE").innerHTML=cE&&cE.hasE?ring(cE.kwh/tE*100,rc(cE.kwh/tE*100),q(cE.kwh)+" / "+tE+" kWh"):empty();
  $("cRingW").innerHTML=cW?ring(cW.m3/tW*100,rc(cW.m3/tW*100),q(cW.m3)+" / "+tW+" "+t("m3")):empty();
  var rows=cE&&cE.hasE?cE.er:cE&&cE.hasG?cE.gr:cW?cW.wr:[];
  $("cPie").innerHTML=pie(rows.filter(function(r){return r.q>0}).map(function(r){return[t("tr")+" "+r.n,r.a,TCOL[r.n-1]]}));
  var src=E.length?E:Ws,col=["var(--c3)","var(--c1)","var(--c2)","var(--c4)"];
  $("cBars").innerHTML=pills(src.slice(-4).map(function(r,i){return{l:fs(r.ts),v:calcRec(r).total,c:col[i%4]}}));
}
function renderHist(){
  var a=recs().sort(function(x,y){return y.ts-x.ts}),da=" "+t("da"),ic={eg:'<svg viewBox="0 0 24 24"><path fill="#ffc83d" d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',w:'<svg viewBox="0 0 24 24"><path fill="#4cc3ff" d="M12 2s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg>'};
  $("hlist").innerHTML=a.length?a.map(function(r){var c=calcRec(r);
    return'<div class="hrow"><span class="ico">'+ic[r.tp]+'</span><div><b>'+f(c.total)+da+'</b><small>'+(r.tp==="eg"?t("nEG"):t("nW"))+" · "+fd(r.ts)+'</small></div><button type="button" data-act="open" data-id="'+r.id+'">'+t("hOpen")+'</button><button type="button" data-act="del" data-id="'+r.id+'" aria-label="'+t("hDel")+'">✕</button></div>'}).join(""):'<p class="empty">'+t("hEmpty")+'</p>';
  $("hnote").textContent=t("hNote");$("hclear").classList.toggle("hidden",!a.length);
}
$("hlist").addEventListener("click",function(e){var b=e.target.closest?e.target.closest("button"):null;if(!b)return;var id=+b.dataset.id,a=recs();
  if(b.dataset.act==="del"){store("recs",JSON.stringify(a.filter(function(r){return r.id!==id})));renderDash();renderHist();return;}
  var r=a.filter(function(x){return x.id===id})[0];if(!r)return;
  var v=function(x){return x==null?"":x};
  if(r.tp==="eg"){$("eo").value=v(r.inp[0]);$("en").value=v(r.inp[1]);$("go").value=v(r.inp[2]);$("gn").value=v(r.inp[3]);$("pmd").value=String(r.inp[4]||6);location.hash="eg";liveAll();$("calc").click();}
  else{$("wo").value=v(r.inp[0]);$("wn").value=v(r.inp[1]);location.hash="w";liveAll();$("wcalc").click();}
});
var armed=false;
$("hclear").addEventListener("click",function(){
  if(!armed){armed=true;this.textContent=t("hSure");setTimeout(function(){armed=false;$("hclear").textContent=t("hClear")},3000);return;}
  armed=false;this.textContent=t("hClear");store("recs","[]");renderDash();renderHist();});

function applyLang(){
  var h=document.documentElement;h.lang=lang;h.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t(e.dataset.i)});
  document.querySelectorAll("#langs button").forEach(function(b){b.classList.toggle("on",b.dataset.l===lang)});
  applyTheme();render();renderWater();showView();liveAll();renderDash();renderHist();
}
function applyTheme(){
  var dark=mode==="dark"||(mode==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme=dark?"dark":"light";
  var b=document.getElementById("theme");b.innerHTML={auto:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>',light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',dark:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>'}[mode];b.title=b.ariaLabel=t(mode);
}
document.getElementById("langs").addEventListener("click",function(e){var l=e.target.dataset.l;if(l){lang=l;store("lang",l);applyLang();}});
document.getElementById("theme").addEventListener("click",function(){mode={auto:"light",light:"dark",dark:"auto"}[mode];store("theme",mode);applyTheme();});
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
document.getElementById("calc").addEventListener("click",function(){
  var v=function(i){return parseFloat(document.getElementById(i).value)},eo=v("eo"),en=v("en"),go=v("go"),gn=v("gn"),err=document.getElementById("err"),out=document.getElementById("out");
  err.textContent="";out.classList.add("hidden");
  var e=[eo,en].filter(isNaN).length,g=[go,gn].filter(isNaN).length;
  if(e===1||g===1){err.textContent=t("errPair");return;}
  if(e===2&&g===2){err.textContent=t("errNeed");return;}
  if((!e&&en<eo)||(!g&&gn<go)){err.textContent=t("errOrder");return;}
  last=compute(e?null:eo,e?null:en,g?null:go,g?null:gn,parseFloat(document.getElementById("pmd").value));
  saveRecord("eg",[e?null:eo,e?null:en,g?null:go,g?null:gn,parseFloat(document.getElementById("pmd").value)]);
  render();out.classList.remove("hidden");out.scrollIntoView({behavior:"smooth",block:"start"});
});
(function(){var l=load("lang"),m=load("theme");
  if(!l){var n=(navigator.language||"ar").slice(0,2);l=T[n]?n:"ar";}
  lang=T[l]?l:"ar";if(m==="light"||m==="dark"||m==="auto")mode=m;applyLang();})();
</script>
